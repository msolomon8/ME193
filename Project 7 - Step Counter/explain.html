function mix(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`; }
const diverging = (v, s) => v >= 0 ? mix(C.neutral, C.orange, clamp(v / s, 0, 1)) : mix(C.neutral, C.blue, clamp(-v / s, 0, 1));
const sequential = (v, s) => mix(C.neutral, C.blue, clamp(v / s, 0, 1));
function text(s, x, y, o = {}) {
  ctx.font = `${o.weight || 400} ${o.size || 18}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
  ctx.fillStyle = o.color || C.ink; ctx.textAlign = o.align || "left"; ctx.textBaseline = o.base || "alphabetic";
  ctx.globalAlpha = o.alpha ?? 1; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}
function trace(data, x, y, w, h, color, o = {}) {
  const lo = o.min ?? Math.min(...data), hi = o.max ?? Math.max(...data), n = data.length;
  const upto = Math.floor((o.progress ?? 1) * (n - 1));
  ctx.strokeStyle = color; ctx.lineWidth = o.lw || 2; ctx.lineJoin = "round"; ctx.globalAlpha = o.alpha ?? 1;
  ctx.beginPath();
  for (let i = 0; i <= upto; i++) {
    const px = x + (i / (n - 1)) * w, py = y + h - ((data[i] - lo) / ((hi - lo) || 1)) * h;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke(); ctx.globalAlpha = 1;
}
function heat(m, x, y, w, h, color, o = {}) {      // m: rows of numbers
  const rows = m.length, cols = m[0].length, cw = w / cols, ch = h / rows, gap = o.gap ?? 1;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    ctx.fillStyle = color(m[r][c]);
    ctx.globalAlpha = o.alpha ?? 1;
    ctx.fillRect(x + c * cw, y + r * ch, Math.max(0.5, cw - gap), Math.max(0.5, ch - gap));
  }
  ctx.globalAlpha = 1;
}
function box(x, y, w, h, o = {}) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, o.r ?? 10);
  if (o.fill) { ctx.fillStyle = o.fill; ctx.globalAlpha = o.alpha ?? 1; ctx.fill(); ctx.globalAlpha = 1; }
  ctx.strokeStyle = o.stroke || C.line; ctx.lineWidth = o.lw || 1.5; ctx.stroke();
}
function arrow(x1, y1, x2, y2, color, o = {}) {
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = o.lw || 2.5;
  ctx.setLineDash(o.dash || []); ctx.lineDashOffset = o.offset || 0;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
  const a = Math.atan2(y2 - y1, x2 - x1), s = 10;
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - s * Math.cos(a - 0.45), y2 - s * Math.sin(a - 0.45));
  ctx.lineTo(x2 - s * Math.cos(a + 0.45), y2 - s * Math.sin(a + 0.45)); ctx.fill();
}
const absMax = a => Math.max(1e-9, ...a.flat(3).map(Math.abs));
const fmt = (v, d = 2) => (Math.abs(v) < 10 ** -d && v !== 0 ? v.toExponential(1) : v.toFixed(d));

// the filter that reacts most to this window: the one shown in the conv scenes
let FB = 0;
function prep() {
  const sdv = D.z1.map(r => { const m = r.reduce((s, v) => s + v, 0) / r.length; return Math.sqrt(r.reduce((s, v) => s + (v - m) ** 2, 0) / r.length); });
  FB = sdv.indexOf(Math.max(...sdv));
}

// ---------- scenes ----------
function channels(data, x, y, w, h, p, o = {}) {
  const rowH = h / 7, cols = CH_COLOR();
  data.forEach((row, i) => {
    const ry = y + i * rowH;
    text(NAMES[i], x - 14, ry + rowH / 2 + 5, { size: 14, align: "right", color: C.muted });
    ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, ry + rowH - 2); ctx.lineTo(x + w, ry + rowH - 2); ctx.stroke();
    trace(row, x, ry + 4, w, rowH - 10, cols[i], { progress: p, lw: 1.8 });
  });
  if (o.events) for (const e of o.events) {
    const ex = x + (e / (data[0].length - 1)) * w;
    if (e / (data[0].length - 1) > p) continue;
    ctx.strokeStyle = C.yellow; ctx.lineWidth = 2; ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.moveTo(ex, y - 6); ctx.lineTo(ex, y + h); ctx.stroke(); ctx.globalAlpha = 1;
  }
}

const scenes = [

  { title: "3 · Convolution: sliding filters look for shapes", dur: 13,

      const yz = v => oy + oh - ((v - bot) / ((top - bot) || 1)) * oh;

      ctx.lineWidth = 2.2; ctx.strokeStyle = C.yellow; ctx.beginPath();

      ctx.stroke();
      if (relu) text("ReLU: negatives → 0", x + w + 20, yz(0) + 5, { size: 16, color: C.muted, alpha: relu });

  { title: "7 · Training: repeat until the loss is small", dur: 11,
    text: () => `PyTorch repeats forward → loss → backward → step for batches of 128 windows, over and over. Starting from random weights, the answer for our window (left) moves toward the truth, and the loss over all the windows (right) falls. The final counter is 5 nets trained this way, each from a different random start; the faint lines are their real training curves.`,
    draw(p) {
      const L = D.learn, n = L.length, prog = ease(seg(p, 0.05, 0.9)), upto = Math.max(1, Math.floor(prog * n));
      const x = 90, y = 120, w = 500, h = 420;
      text("this window's answer, epoch by epoch", x, 90, { size: 18, weight: 600 });
      const top = Math.max(D.target, ...L.map(l => l.out)) * 1.25 + 0.2;
      const yy = v => y + h - (v / top) * h;
      ctx.strokeStyle = C.yellow; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);

      ctx.strokeStyle = C.line; ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = C.blue;
      L.slice(0, upto).forEach((l, i) => { ctx.beginPath(); ctx.arc(x + (i / (n - 1)) * w, yy(l.out), 5, 0, 7); ctx.fill(); });
      text("epoch", x + w / 2, y + h + 30, { size: 14, align: "center", color: C.muted });
      const cur = L[upto - 1];
      text(`epoch ${cur.epoch}: net says ${fmt(cur.out)}`, x, y + h + 60, { size: 18, weight: 600 });

      const x2 = 700, w2 = 500;
      text("loss over all windows (log scale)", x2, 90, { size: 18, weight: 600 });
      ctx.strokeStyle = C.line; ctx.strokeRect(x2, y, w2, h);
      const all = [...L.map(l => l.loss), ...D.history.flat()].filter(v => v > 0);
      const lmax = Math.log10(Math.max(...all)), lmin = Math.log10(Math.min(...all));
      const ly = v => y + h - ((Math.log10(v) - lmin) / ((lmax - lmin) || 1)) * h;
      D.history.forEach(hh => {
        ctx.strokeStyle = C.blue; ctx.globalAlpha = 0.25; ctx.lineWidth = 1.5; ctx.beginPath();
        hh.slice(0, Math.ceil(prog * hh.length)).forEach((v, i) => { const px = x2 + (i / (hh.length - 1)) * w2; i ? ctx.lineTo(px, ly(v)) : ctx.moveTo(px, ly(v)); });
        ctx.stroke(); ctx.globalAlpha = 1;
      });
      ctx.strokeStyle = C.orange; ctx.lineWidth = 2.5; ctx.beginPath();
      L.slice(0, upto).forEach((l, i) => { const px = x2 + (i / (n - 1)) * w2; i ? ctx.lineTo(px, ly(l.loss)) : ctx.moveTo(px, ly(l.loss)); });
      ctx.stroke();
      text(`loss ${fmt(L[0].loss, 3)} → ${fmt(cur.loss, 3)}`, x2, y + h + 60, { size: 18, weight: 600, color: C.orange });
    } },

  { title: "8 · Counting a whole walk, and how sure it is", dur: 12,
    text: () => {
      const s = D.summary, c = D.cv;
      return `Sliding the window across the recording and adding the answers (blue) follows your real steps (yellow). ` +
        (c ? `Tested fairly, by nets that never saw this recording, it counted ${c.nn.toFixed(0)} ± ${(2 * c.sd).toFixed(1)} against your ${c.true}. ` : "") +
        `Over every held-out recording the average error is ${s.nn_mean_abs_error_pct.toFixed(1)} %` +
        (s.peak_mean_abs_error_pct != null ? `, against ${s.peak_mean_abs_error_pct.toFixed(1)} % for a plain peak counter with no learning.` : ".");
    },
    draw(p) {
      const ph = D.per_hop, n = ph.length, x = 90, y = 90, w = 1100, h = 420, prog = ease(seg(p, 0.05, 0.75));
      const upto = Math.max(1, Math.floor(prog * n));
      const cum = [0]; ph.forEach(v => cum.push(cum.at(-1) + v));
      const top = Math.max(cum.at(-1), D.true_cum.at(-1)) * 1.08 + 1;
      const yy = v => y + h - (v / top) * h, xx = i => x + (i / n) * w;
      ctx.strokeStyle = C.line; ctx.strokeRect(x, y, w, h);
      text("steps so far", x, y - 16, { size: 16, color: C.muted });
      const bw = w / n;
      for (let i = 0; i < upto; i++) { ctx.fillStyle = C.blue; ctx.globalAlpha = 0.22; ctx.fillRect(xx(i), y + h - (ph[i] / 2) * 90, bw - 1, (ph[i] / 2) * 90); }
      ctx.globalAlpha = 1;
      ctx.strokeStyle = C.yellow; ctx.lineWidth = 3; ctx.beginPath();
      D.true_cum.slice(0, upto + 1).forEach((v, i) => { i ? (ctx.lineTo(xx(i), yy(D.true_cum[i - 1])), ctx.lineTo(xx(i), yy(v))) : ctx.moveTo(xx(0), yy(v)); });
      ctx.stroke();
      ctx.strokeStyle = C.blue; ctx.lineWidth = 3; ctx.beginPath();
      cum.slice(0, upto + 1).forEach((v, i) => { i ? ctx.lineTo(xx(i), yy(v)) : ctx.moveTo(xx(0), yy(v)); });
      ctx.stroke();
      text("pale bars: the answer for each 0.5 s", x + 10, y + h - 100, { size: 14, color: C.muted });
      const nearEnd = xx(upto) > x + w - 160;
      text(`net: ${cum[upto].toFixed(1)}`, xx(upto) + (nearEnd ? -8 : 8), yy(cum[upto]) - 10,
           { size: 18, weight: 700, color: C.blue, align: nearEnd ? "right" : "left" });
      const f = ease(seg(p, 0.78, 0.95));
      if (f) {
        const c = D.cv, s = D.summary;
        box(90, 560, 340, 120, { stroke: C.yellow });
        text("you counted", 110, 595, { size: 17, color: C.muted, alpha: f });
        text(`${D.counted}`, 110, 655, { size: 46, weight: 800, alpha: f });
        box(460, 560, 360, 120, { stroke: C.blue });
        text("nets that never saw it", 480, 595, { size: 17, color: C.muted, alpha: f });
        text(c ? `${c.nn.toFixed(0)} ± ${(2 * c.sd).toFixed(1)}` : "—", 480, 655, { size: 46, weight: 800, alpha: f });
        box(850, 560, 340, 120, { stroke: C.line });
        text("all held-out recordings", 870, 595, { size: 17, color: C.muted, alpha: f });
        text(`${s.nn_mean_abs_error_pct.toFixed(1)} % avg error`, 870, 650, { size: 30, weight: 800, alpha: f });
      }
    } },
];

// ---------- player ----------
let cur = 0, t = 0, playing = true, lastT = performance.now();
const $ = id => document.getElementById(id);
const dots = $("dots");
scenes.forEach((s, i) => {
  const b = document.createElement("button"); b.textContent = i; b.setAttribute("aria-label", s.title);
  b.onclick = () => go(i); dots.appendChild(b);
});
function go(i) { cur = (i + scenes.length) % scenes.length; t = 0; caption(); }
function caption() {
  $("title").textContent = scenes[cur].title;
  $("text").textContent = scenes[cur].text();
  [...dots.children].forEach((b, i) => b.setAttribute("aria-current", String(i === cur)));
}
$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pause" : "Play"; };
document.addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); $("play").click(); }
  if (e.key === "ArrowRight") go(cur + 1);
  if (e.key === "ArrowLeft") go(cur - 1);
});
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (playing) t += dt * parseFloat($("speed").value);
  const s = scenes[cur];
  if (t > s.dur + 1.5) { if (cur < scenes.length - 1) go(cur + 1); else { t = s.dur + 1.5; } }
  colors();
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = C.surface; ctx.fillRect(0, 0, W, H);
  s.draw(Math.min(1, t / s.dur), t);
  $("prog").style.width = (100 * Math.min(1, t / s.dur)) + "%";
  requestAnimationFrame(frame);
}
if (!D) {
  document.querySelector(".caption").innerHTML = "<h2>No data yet</h2><p>Run train.py and then explain_export.py on the laptop; they fill this page with your real recordings and nets.</p>";
} else {
  prep(); caption(); requestAnimationFrame(frame);
}
</script>
